<main class="login">
  <mat-card appearance="outlined" class="carte">
    <mat-card-header><h1 mat-card-title>Connexion</h1></mat-card-header>
    <mat-card-content>
      <form [formGroup]="formulaire" (ngSubmit)="connecter()" class="formulaire">
        <mat-form-field appearance="outline">
          <mat-label>Identifiant</mat-label>
          <input matInput id="login" type="text" formControlName="login" autocomplete="username" autofocus />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input matInput id="motDePasse" type="password" formControlName="motDePasse" autocomplete="current-password" />
        </mat-form-field>

        @if (erreur(); as message) {
          <p class="erreur" role="alert">{{ message }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="formulaire.invalid || enCours()">
          {{ enCours() ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
